name: Price Guardian verification

on:
  push:
    branches: ['feat/price-guardian']
  pull_request:

permissions:
  contents: read

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'feat/price-guardian'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FEATURE_BASE: 8ccc49618beeb38b3bc976a715f1a2a2d82990ac
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect installed client-component guide
        run: |
          find node_modules/next/dist/docs -type f \
            -iname '*server-and-client-components*' -print \
            -exec sed -n '1,180p' '{}' \;

      - name: Verify every feature commit
        run: npx commitlint --from "$FEATURE_BASE" --to HEAD --verbose

      - name: Scan changed files for secrets
        run: |
          git diff --name-only --diff-filter=ACM -z "$FEATURE_BASE" HEAD \
            | xargs -0 -r npx secretlint

      - name: Set up isolated database
        run: npm run db:setup

      - name: Complete quality gate
        run: npm run check:all

      - name: Formatting diagnostics on failure
        if: failure()
        run: |
          git diff --name-only --diff-filter=ACM -z "$FEATURE_BASE" HEAD \
            | xargs -0 -r npx prettier --write
          git diff --exit-code
