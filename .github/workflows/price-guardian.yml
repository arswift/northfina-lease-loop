name: Price Guardian verification

on:
  push:
    branches: ['feat/price-guardian']
  pull_request:

permissions:
  contents: read

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'feat/price-guardian'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FEATURE_BASE: 8ccc49618beeb38b3bc976a715f1a2a2d82990ac
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify every feature commit
        run: npx commitlint --from "$FEATURE_BASE" --to HEAD --verbose

      - name: Scan changed files for secrets
        run: |
          git diff --name-only --diff-filter=ACM -z "$FEATURE_BASE" HEAD \
            | xargs -0 -r npx secretlint

      - name: Set up isolated database
        run: npm run db:setup

      - name: Complete quality gate
        run: npm run check:all

      - name: Set browser test paths
        run: |
          echo "UI_QA_TOOLS=$RUNNER_TEMP/guardian-tools" >> "$GITHUB_ENV"
          echo "UI_OUTPUT_DIR=$RUNNER_TEMP/guardian-results" >> "$GITHUB_ENV"

      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$UI_QA_TOOLS" --no-save --package-lock=false playwright@1.57.0 axe-core@4.11.0
          node "$UI_QA_TOOLS/node_modules/playwright/cli.js" install chromium --only-shell

      - name: Verify real browser interactions
        shell: bash
        run: |
          mkdir -p "$UI_OUTPUT_DIR"
          npm start -- --hostname 127.0.0.1 > "$UI_OUTPUT_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/check-price-guardian.mjs

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: price-guardian-${{ github.sha }}
          path: ${{ runner.temp }}/guardian-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Formatting diagnostics on failure
        if: failure()
        run: |
          git diff --name-only --diff-filter=ACM -z "$FEATURE_BASE" HEAD \
            | xargs -0 -r npx prettier --ignore-unknown --write
          git diff --exit-code
